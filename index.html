<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Report Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      max-width: 600px;
      margin: auto;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>StudySphere Report Test</h1>

  <button id="sendReport">
    Send Test Report
  </button>

  <div id="status"></div>

  <script>

    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXR7L9lMGyh7NTj-dEzI_OcudYEHg_a12VZNkA8RVIpSZV_oRSFkZpSYlIzeDDx6vRPQ/exec";

    document
      .getElementById("sendReport")
      .addEventListener("click", async function () {

        const status = document.getElementById("status");

        status.textContent = "Sending...";

        const reportData = {

          quizId: "TEST-QUIZ-001",

          questionId: "TEST-Q001",

          questionNumber: 1,

          subject: "History",

          chapter: "Modern Indian History",

          question: "This is a website connection test question.",

          issue: "Wrong Question",

          additionalDetails:
            "This report was submitted from the StudySphere website test page."

        };

        try {

          await fetch(GOOGLE_SCRIPT_URL, {

            method: "POST",

            mode: "no-cors",

            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },

            body: JSON.stringify(reportData)

          });

          status.textContent =
            "Report request sent. Check Google Sheet.";

        } catch (error) {

          console.error(error);

          status.textContent =
            "Something went wrong while sending the report.";

        }

      });

  </script>

</body>
</html>
